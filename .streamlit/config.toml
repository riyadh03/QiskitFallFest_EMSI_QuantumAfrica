[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1E293B"
font = "sans serif"

[server]
headless = true
runOnSave = false
# OneDrive folders miss native file events; polling makes edited modules reload reliably
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
